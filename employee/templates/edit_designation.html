{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Designation</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="dashboard-wrapper">
        <div class="main-content" style="padding:40px;">
            <h1 style="text-align:center;margin-bottom:30px;color:#2c3e50;">Edit Designation</h1>

            {% if messages %}
                {% for message in messages %}
                    <div style="text-align:center;margin:20px auto;padding:15px;border-radius:12px;background:'{% if message.tags == 'error' %}#ff7675{% else %}#00b894{% endif %};color:white;max-width:700px;'">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" style="max-width:700px;margin:0 auto;background:white;padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1);">
                {% csrf_token %}

                <div style="margin-bottom:25px;">
                    <label style="display:block;margin-bottom:8px;font-weight:bold;color:#2c3e50;">Department <span style="color:red;">*</span></label>
                    <select name="department" required style="width:100%;padding:15px;border-radius:12px;border:2px solid #ddd;font-size:1.1rem;">
                        {% for dept in departments %}
                            <option value="{{ dept.id }}" {% if dept.id == designation.department.id %}selected{% endif %}>
                                {{ dept.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div style="margin-bottom:25px;">
                    <label style="display:block;margin-bottom:8px;font-weight:bold;color:#2c3e50;">Designation Name <span style="color:red;">*</span></label>
                    <input type="text" name="designation_name" value="{{ designation.designation_name }}" required 
                           style="width:100%;padding:15px;border-radius:12px;border:2px solid #ddd;font-size:1.1rem;">
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                    <div>
                        <label style="display:block;margin-bottom:8px;font-weight:bold;color:#2c3e50;">Role <span style="color:red;">*</span></label>
                        <select name="role" required style="width:100%;padding:15px;border-radius:12px;border:2px solid #ddd;font-size:1.1rem;">
                            <option value="EMPLOYEE" {% if not designation.is_managerial %}selected{% endif %}>Employee</option>
                            <option value="MANAGER" {% if designation.is_managerial %}selected{% endif %}>Manager</option>
                        </select>
                    </div>
                    <div>
                        <label style="display:block;margin-bottom:8px;font-weight:bold;color:#2c3e50;">Base Salary (₹) <span style="color:red;">*</span></label>
                        <input type="number" name="base_salary" value="{{ designation.base_salary }}" required min="0" step="1000"
                               style="width:100%;padding:15px;border-radius:12px;border:2px solid #ddd;font-size:1.1rem;">
                    </div>
                </div>

                <div style="text-align:center;margin-top:40px;">
                    <a href="{% url 'employee:admin_dashboard' %}?section=designations" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn" style="background:#e67e22;color:white;padding:16px 50px;font-size:1.1rem;">
                        Update Designation
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
