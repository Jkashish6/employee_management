{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee - {{ employee.firstname }} {{ employee.lastname }}</title>
    
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ecc71;
            --danger: #e74c3c;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .form-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .form-header {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .form-header h2 {
            margin: 0;
            font-weight: 600;
            font-size: 2rem;
        }
        .form-body {
            padding: 40px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67,97,238,0.15);
        }
        textarea { min-height: 100px; resize: vertical; }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .btn-primary:hover {
            background: #3651d4;
            transform: translateY(-2px);
        }
        .btn-back {
            background: #6c757d;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            margin-right: 15px;
        }
        .alert {
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container-fluid form-container">
        <div class="form-card">
            <div class="form-header">
                <h2>Edit Employee</h2>
                <p>Updating details for <strong>{{ employee.firstname }} {{ employee.lastname }}</strong></p>
            </div>

            <div class="form-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
                            <i class="fas fa-{% if message.tags == 'error' %}exclamation-triangle{% else %}check-circle{% endif %}"></i>
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" name="firstname" value="{{ employee.firstname }}" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name *</label>
                            <input type="text" name="lastname" value="{{ employee.lastname }}" required>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" name="phone" value="{{ employee.phone }}" pattern="[0-9]{10}" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address *</label>
                            <input type="email" name="email" value="{{ employee.email }}" required>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Date of Birth *</label>
                            <input type="date" name="dob" value="{{ employee.dob|date:'Y-m-d' }}" max="{{ today_date }}" required>
                        </div>
                        <div class="form-group">
                            <label>Join Date *</label>
                            <input type="date" name="join_date" value="{{ employee.join_date|date:'Y-m-d' }}" required>
                        </div>
                    </div>

                    <!-- DEPARTMENT -->
                    <div class="form-group">
                        <label>Department <span style="color:red;">*</span></label>
                        <select name="department" id="department" required onchange="loadDesignations()">
                            <option value="">-- Select Department --</option>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}" {% if dept.id == employee.department.id %}selected{% endif %}>
                                    {{ dept.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- DESIGNATION (AJAX) -->
                    <div class="form-group">
                        <label>Designation <span style="color:red;">*</span></label>
                        <select name="designation" id="designation" required>
                            <option value="">-- Select designation --</option>
                            {% if employee.designation %}
                                <option value="{{ employee.designation.id }}" selected>
                                    {{ employee.designation.designation_name }} (₹{{ employee.designation.base_salary }})
                                </option>
                            {% endif %}
                        </select>
                    </div>

                    <!-- MANAGER FIELD – Only show if current designation is NOT managerial -->
                    <div class="form-group" id="manager-field" 
     class="{% if employee.designation.is_managerial %}d-none{% else %}d-block{% endif %}">
    <label>Assign Manager</label>
    <select name="manager" id="manager">
        <option value="">No Manager (Reports to HR)</option>
        {% for mgr in managers %}
            <option value="{{ mgr.id }}" {% if employee.user.manager_id == mgr.id %}selected{% endif %}>
                {{ mgr.get_full_name }}
            </option>
        {% endfor %}
    </select>
</div>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea name="address" placeholder="Full residential address" required>{{ employee.address }}</textarea>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" name="status" id="status" {% if employee.status %}checked{% endif %}>
                        <label for="status">Employee is active</label>
                    </div>

                    <div class="text-center mt-4">
                        <a href="{% url 'employee:admin_dashboard' %}" class="btn-back">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary btn-lg">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load designations on page load if department is already selected
        document.addEventListener('DOMContentLoaded', function() {
            const deptSelect = document.getElementById('department');
            if (deptSelect.value) {
                loadDesignations();
            }
        });

        function loadDesignations() {
            const deptId = document.getElementById('department').value;
            const desigSelect = document.getElementById('designation');
            const managerField = document.getElementById('manager-field');

            if (!deptId) {
                desigSelect.innerHTML = '<option value="">-- First select department --</option>';
                managerField.style.display = 'none';
                return;
            }

            fetch(`/get-designations/?dept=${deptId}`)
                .then(response => response.json())
                .then(data => {
                    // Keep current selection if possible
                    const currentValue = desigSelect.value;
                    desigSelect.innerHTML = '<option value="">-- Select Designation --</option>';
                    
                    data.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.id;
                        opt.textContent = `${d.designation_name} (₹${d.base_salary})`;
                        opt.dataset.is_managerial = d.is_managerial;
                        if (d.id == currentValue) opt.selected = true;
                        desigSelect.appendChild(opt);
                    });

                    // Show/hide manager field based on selected designation
                    const selectedOpt = desigSelect.options[desigSelect.selectedIndex];
                    if (selectedOpt && selectedOpt.dataset.is_managerial === 'true') {
                        managerField.style.display = 'none';
                    } else {
                        managerField.style.display = 'block';
                    }
                });
        }

        // Update manager field visibility when designation changes
        document.getElementById('designation').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            const isManagerial = selected && selected.dataset.is_managerial === 'true';
            document.getElementById('manager-field').style.display = isManagerial ? 'none' : 'block';
        });
    </script>
</body>
</html>
